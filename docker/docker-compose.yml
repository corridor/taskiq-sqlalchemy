services:
  postgres:
    image: postgres:10
    restart: always
    environment:
      POSTGRES_USER: taskiq_user
      POSTGRES_PASSWORD: taskiq_pwd
      POSTGRES_DB: taskiq
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "taskiq_user", "-d", "taskiq"]
      interval: 3s
      timeout: 1s
      retries: 5
    networks:
      - default

  oracle:
    image: gvenzl/oracle-xe:21-slim
    restart: always
    environment:
      ORACLE_DATABASE: taskiq
      ORACLE_PASSWORD: "PasswoRd"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./initdb.d:/container-entrypoint-initdb.d:ro
    ports:
      - 1521:1521
      - 5500:5500
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 3s
      timeout: 1s
      retries: 5
    networks:
      - default

volumes:
  postgres_data:
  oracle_data:
networks:
  default:
    driver: bridge
