[build-system]
requires = ["setuptools>=48"]
build-backend = "setuptools.build_meta"

[project]
name = "taskiq-sqlalchemy"
version = "0.0.1"
description = "Fast and flexible SqlAlchemy integration for TaskIQ"
readme = "README.md"
authors = [
    { name = "Corridor Platforms", email = "postmaster@corridorplatforms.com" },
]
license = "MIT"
requires-python = ">= 3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Framework :: AsyncIO",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = ["taskiq>=0.11.7", 'sqlalchemy>=2', 'anyio>=4']

[project.optional-dependencies]
all = [
    "taskiq_sqlalchemy[postgresql-asyncpg,postgresql-psycopg,sqlite-aiosqlite,oracle-oracledb,mssql-aioodbc,mysql-aiomysql]",
]

postgresql-asyncpg = ["asyncpg"]
postgresql-psycopg = ["psycopg[binary,pool]"]
sqlite-aiosqlite = ["aiosqlite"]
oracle-oracledb = ["oracledb"]
mssql-aioodbc = ["aioodbc"]
mysql-aiomysql = ["aiomysql"]

[project.urls]
Homepage = "https://github.com/corridor/taskiq-sqlalchemy"
Documentation = "https://github.com/corridor/taskiq-sqlalchemy"
"Source Code" = "https://github.com/corridor/taskiq-sqlalchemy"
"Issue Tracker" = "https://github.com/corridor/taskiq-sqlalchemy/issues"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-anyio",
    "pytest-cov",
    "pytest-env",
    "asyncpg-stubs",
    "pre-commit",
    "pytest-xdist",
    "pytest-timeout",
    # Drivers for result-backend tests
    "aiosqlite", # SQLite async driver — zero external service
    "asyncpg",   # PostgreSQL asyncpg driver (optional in local dev)
    "psycopg",   # PostgreSQL psycopg3 driver (optional in local dev)
    "oracledb",  # OracleDB driver (optional in local dev)
    "aioodbc",   # SQL Server driver (optional in local dev)
    "aiomysql",  # MySQL driver (optional in local dev)
]

[tool.setuptools.packages.find]
include = ["taskiq_sqlalchemy", "taskiq_sqlalchemy.*"]

[tool.uv]
required-environments = [
    # This tells uv to treat 3.9/3.10 as separate envs not to be mixed with 3.11+
    # So, when upgrading - uv can take latest pkg for 3.11+ and older pkg for older python versions
    # Ref: https://github.com/astral-sh/uv/issues/9425
    "python_version == '3.9'",
    "python_version == '3.10'",
]

[tool.uv.pip]
universal = true

[tool.pytest.ini_options]
markers = [
    "postgresql: tests that require a running PostgreSQL server",
    "oracle: tests that require a running OracleDB server",
    "mssql: tests that require a running SQL Server instance",
    "mysql: tests that require a running MySQL server",
]

[tool.ruff]
line-length = 120
output-format = "grouped"
target-version = "py39"

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "COM",    # flake8-commas
    "E",      # pycodestyle - errors
    "EXE",    # flake8-executable
    "F",      # pyflakes
    "FBT",    # flake8-boolean-trap
    "FLY",    # flynt
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PGH",    # pygrep-hooks
    "PLC",    # pylint-convention
    "PLE",    # pylint-error
    "PLR",    # pylint-refactor
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "PYI024", # flake8-pyi
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff specific rules
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle - warnings
    "YTT",    # flake8-2020
]
ignore = [
    'TRY003', # Allow exceptions messages outside of Exception classes
    "ANN002", # Skip typing for *args as they are hard to type
    "ANN003", # Skip typing for **kwargs as they are hard to type
    "COM812", # Do not force trailing commas
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "__future__.annotations is discouraged. See PEP-649 and PEP-749"

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"typing" = "t"

[tool.ruff.lint.isort]
known-first-party = ["taskiq_sqlalchemy*"]
combine-as-imports = true
order-by-type = false
lines-after-imports = 2
case-sensitive = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # Use of assert detected
    "S301",   # Use of pickle detected
    "D103",   # Missing docstring in public function
    "SLF001", # Private member accessed
    "S311",   # Standard pseudo-random generators are not suitable for security/cryptographic purposes
    "D101",   # Missing docstring in public class
]
