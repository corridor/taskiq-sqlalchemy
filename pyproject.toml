[build-system]
requires = ["setuptools>=48"]
build-backend = "setuptools.build_meta"

[project]
name = "taskiq-sqlalchemy"
version = "0.0.1"
description = "Fast and flexible SqlAlchemy integration for TaskIQ"
readme = "README.md"
authors = [
    { name = "Corridor Platforms", email = "postmaster@corridorplatforms.com" },
]
license = "MIT"
requires-python = ">= 3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Framework :: AsyncIO",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = [
    "taskiq",
    "tasks",
    "distributed",
    "async",
    "postgresql",
    "asyncpg",
    "psycopg3",
    "sqlalchemy",
]

dependencies = ["taskiq>=0.11.7", 'sqlalchemy>=2', 'anyio>=4']

[project.optional-dependencies]
all = ["taskiq_sqlalchemy[postgresql,sqlite]"]

postgresql = ["asyncpg", "psycopg[binary,pool]"]
sqlite = ["aiosqlite"]

[project.urls]
Homepage = "https://github.com/corridor/taskiq-sqlalchemy"
Documentation = "https://github.com/corridor/taskiq-sqlalchemy"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-anyio",
    "pytest-cov",
    "pytest-env",
    "asyncpg-stubs",
    "pre-commit",
    "pytest-xdist",
    "pytest-timeout",
    # Drivers for result-backend tests
    "aiosqlite", # SQLite async driver — zero external service
    "asyncpg",   # PostgreSQL asyncpg driver (optional in local dev)
    "psycopg",   # PostgreSQL psycopg3 driver (optional in local dev)
]

[tool.setuptools.packages.find]
include = ["taskiq_sqlalchemy", "taskiq_sqlalchemy.*"]

[tool.uv]
required-environments = [
    # This tells uv to treat 3.9/3.10 as separate envs not to be mixed with 3.11+
    # So, when upgrading - uv can take latest pkg for 3.11+ and older pkg for older python versions
    # Ref: https://github.com/astral-sh/uv/issues/9425
    "python_version == '3.9'",
    "python_version == '3.10'",
]

[tool.uv.pip]
universal = true

[tool.pytest.ini_options]
markers = [
    "postgresql: tests that require a running PostgreSQL server (skip if unavailable)",
]

[tool.ruff.lint]
select = [
    "E",   # Error
    "F",   # Pyflakes
    "W",   # Pycodestyle
    "C90", # McCabe complexity
    "I",   # Isort
    "N",   # pep8-naming
    "ANN", # Pytype annotations
    "S",   # Bandit
    "B",   # Bugbear
    "COM", # Commas
    "C4",  # Comprehensions
    "ISC", # Implicit string concat
    "PIE", # Unnecessary code
    "T20", # Catch prints
    "PYI", # validate pyi files
    "Q",   # Checks for quotes
    "RSE", # Checks raise statements
    "RET", # Checks return statements
    "SLF", # Self checks
    "SIM", # Simplificator
    "PTH", # Pathlib checks
    "ERA", # Checks for commented out code
    "PL",  # PyLint checks
    "RUF", # Specific to Ruff checks
]
ignore = [
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "D212",    # Multi-line docstring summary should start at the first line
    "D401",    # First line should be in imperative mood
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "ANN401",  # typing.Any are disallowed in `**kwargs
    "PLR0913", # Too many arguments for function call
    "D106",    # Missing docstring in public nested class
    "COM812",  # Use of assert detected
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["taskiq_dependencies.Depends", "taskiq.TaskiqDepends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # Use of assert detected
    "S301",   # Use of pickle detected
    "D103",   # Missing docstring in public function
    "SLF001", # Private member accessed
    "S311",   # Standard pseudo-random generators are not suitable for security/cryptographic purposes
    "D101",   # Missing docstring in public class
]
"scripts/*" = [
    "S101",   # Use of assert detected
    "S301",   # Use of pickle detected
    "D103",   # Missing docstring in public function
    "SLF001", # Private member accessed
    "S311",   # Standard pseudo-random generators are not suitable for security/cryptographic purposes
    "D101",   # Missing docstring in public class
    "T201",   # Use of assert detected
    "S603",   # Use of subprocess.run detected
]
